[package]
name = "skill-loadout"
version = "0.2.0"
description = "Tray client for skill-loadout: manage Agents and skill groups, and prepare a set for the next Claude Code session."
authors = ["chipfighter"]
license = "MIT"
repository = "https://github.com/chipfighter/skill-loadout"
edition = "2021"
rust-version = "1.80"

[lib]
name = "skill_loadout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
